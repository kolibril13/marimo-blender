schema_version = "1.0.0"

id = "marimo_blender"
version = "0.3.17"
name = "Marimo"
tagline = "Reactive notebook for Python integrated in Blender"
maintainer = "Dale Chan <imare32@outlook.com>, Jan-Hendrik Müller"
