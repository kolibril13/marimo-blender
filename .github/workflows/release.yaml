on:
  push:
    tags:
      - "v*"

name: Release

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Copy LICENSE file
        run: cp -p LICENSE marimo_blender/

      - name: Create a zip
        run: zip -r -9 marimo-blender-${GITHUB_REF_NAME}.zip marimo_blender/

      - name: Create a Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: marimo-blender ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            marimo-blender-${{ github.ref_name }}.zip
          draft: false
          generate_release_notes: true
          prerelease: false

      - name: Trigger website rebuild
        run: curl -X POST "${{ secrets.CF_DEPLOY_HOOK_URL }}"